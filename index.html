<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Mientras la carencia esté incompleta, el sitio no se indexa: se comparte solo por link. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Agroquímicos CRM</title>
  <meta name="description" content="Agroquímicos CRM: catálogo de agroquímicos de Chile según etiquetas SAG, con dosis, carencias, modos de acción y plan de aplicaciones.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Agroquímicos CRM">
  <meta property="og:description" content="Busca productos, cultivos, plagas, enfermedades y malezas según etiquetas SAG, y arma tu plan de aplicaciones.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <!-- supabase-js con versión fija y huella SRI. Si jsDelivr falla, se intenta unpkg con la misma huella. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha256-WdOUh8NYmEO0EDItij1WLOAiq6HlzLFomO8/sqDaLs0="
          crossorigin="anonymous"
          onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';s.integrity='sha256-WdOUh8NYmEO0EDItij1WLOAiq6HlzLFomO8/sqDaLs0=';s.crossOrigin='anonymous';document.head.appendChild(s);"></script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <a class="saltar" href="#vista">Ir al contenido</a>

  <header class="cabecera">
    <div class="cabecera-in">
      <a class="marca" href="#/" aria-label="Agroquímicos CRM, inicio">
        <span class="marca-logo" aria-hidden="true">CRM</span>
        <span class="marca-texto">
          <strong>Agroquímicos CRM</strong>
          <small>Etiquetas SAG · plan de aplicaciones</small>
        </span>
      </a>
      <nav class="nav-sup" aria-label="Secciones" data-nav></nav>
    </div>
  </header>

  <main id="vista" class="vista" tabindex="-1">
    <div class="cargando" role="status">
      <span class="ruedita" aria-hidden="true"></span>
      Cargando el catálogo…
    </div>
    <noscript>
      <p class="nota nota-alerta">Este sitio necesita JavaScript activado para consultar el catálogo.</p>
    </noscript>
  </main>

  <footer class="pie">
    <div class="pie-in">
      <div class="pie-marca">
        <span class="marca-logo" aria-hidden="true">CRM</span>
        <strong>Agroquímicos CRM</strong>
      </div>
      <p data-actualizado></p>
    </div>
  </footer>

  <nav class="nav-inf" aria-label="Secciones" data-nav></nav>
</body>
</html>
